[project]
name = "renderizador"
version = "1.2.0"
description = "Renderizador para o curso de Computação Gráfica"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "matplotlib",
    "pillow",
    "qtpy",
    "pyqt6",
]

[dependency-groups]
dev = [
    "matplotlib-stubs",
    "ruff",
]

[tool.pyright]
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "D", "D300", "D209", "Q002"]
# D401 (imperative mood) é um heurístico em inglês — gera falso positivo em
# docstrings em português (ex: "Converte").
# D200 exige que docstrings de uma linha fiquem numa linha só — aqui a
# convenção é o oposto: """ abrindo e fechando em linha própria (D209/D213).
ignore = ["D401", "D200"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
