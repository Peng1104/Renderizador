[project]
name = "renderizador"
version = "1.1.1"
description = "Renderizador para o curso de Computação Gráfica"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "matplotlib>=3.11.1",
    "pillow>=12.3.0",
    "qtpy>=2.4.3",
    "pyqt6>=6.11.0",
]

[dependency-groups]
dev = [
    "matplotlib-stubs>=0.3.11",
]

[tool.pyright]
typeCheckingMode = "strict"
